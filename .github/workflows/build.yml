# 밀어 올릴 때마다 시험하고 맥·윈도우 설치 파일을 만든다 (Actions 탭 → 실행 결과의 Artifacts).
# v로 시작하는 태그(v0.1.1 등)를 올리면 같은 파일로 GitHub 릴리스를 만든다 — 앱의 새 버전 알림·자동 업데이트가 이 릴리스를 본다.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run test:unit
      # 윈도우에서 만들 때는 exe에 아이콘·버전 정보를 넣는다
      - run: npx electron-builder --win nsis zip --x64 --config.win.signAndEditExecutable=true --publish never
      - uses: actions/upload-artifact@v4
        with: { name: MyPlanner-windows, path: "dist/MyPlanner-*windows*" }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run test:unit
      # 화면까지 띄우는 시험 (가짜 AI)
      - run: npm test
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with: { name: MyPlanner-mac, path: "dist/*.dmg" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 태그와 package.json 버전이 같아야 한다 (앱이 받은 파일의 버전을 확인한다)
      - run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 릴리스 만들기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes "${notes:-$GITHUB_REF_NAME}"
